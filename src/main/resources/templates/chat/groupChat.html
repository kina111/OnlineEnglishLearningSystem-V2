<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${chat.name}">Hội thoại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-header .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #6c757d;
        }

        .chat-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- Mỗi dòng tin nhắn (container flex) --- */
        .message-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message-row.me {
            align-items: flex-end;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
            display: inline-block;
        }

        .message.other {
            background-color: #e9ecef;
            border-bottom-left-radius: 0;
        }

        .message.me {
            background-color: #0d6efd;
            color: white;
            border-bottom-right-radius: 0;
        }

        .message-sender {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: #495057;
        }

        .chat-footer {
            border-top: 1px solid #dee2e6;
            background-color: #ffffff;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-footer input[type="text"] {
            flex-grow: 1;
            border-radius: 25px;
            padding: 10px 15px;
        }

        .chat-footer button {
            border-radius: 25px;
            padding: 10px 20px;
        }

        .chat-footer form {
            display: flex;
            width: 100%;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="chat-header">
    <div class="chat-avatar">
        <img th:if="${chat.avatar != null}" th:src="@{'/uploads/' + ${chat.avatar}}" alt="avatar">
        <i th:if="${chat.avatar == null}"
           th:classappend="${chat.type.name() == 'GROUP'} ? 'fa-solid fa-users' : 'fa-solid fa-user'"></i>
    </div>
    <div>
        <div class="chat-name" th:text="${chat.name}">Tên nhóm</div>
        <a th:href="@{'/chats/group/' + ${chat.id} + '/detail'}" class="small text-muted text-decoration-none">
            Xem thông tin nhóm
        </a>
    </div>
</div>

<!-- Chat content -->
<div id="chat" class="chat-box">
    <div th:each="message : ${chat.messages}"
         th:classappend="${message.sender.id == user.id} ? 'message-row me' : 'message-row'">
        <div th:if="${message.sender.id != user.id}" class="message-sender"
             th:text="${message.sender.fullName}">Người gửi</div>
        <div th:classappend="${message.sender.id == user.id} ? 'message me' : 'message other'">
            <div th:text="${message.content}">Nội dung tin nhắn</div>
        </div>
        <div class="text-muted small mt-1"
             th:text="${#temporals.format(message.createdAt, 'HH:mm')}"></div>
    </div>
</div>

<!-- Footer -->
<div class="chat-footer">
    <form th:action="@{/chats/group/{groupId}/send(groupId=${chat.id})}" method="post">
        <input type="hidden" name="from" th:value="${user.id}">
        <input type="text" name="content" class="form-control" placeholder="Nhập tin nhắn...">
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </form>
</div>

<script>
    // Tự động cuộn xuống cuối khi load trang
    const chatBox = document.getElementById('chat');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>
