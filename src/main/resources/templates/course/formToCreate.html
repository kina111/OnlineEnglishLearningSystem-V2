<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo khóa học mới</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CKEditor 5 CDN (Hoàn toàn miễn phí) -->
    <script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

    <style>
        .preview-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        /* Tùy chỉnh chiều cao cho CKEditor */
        .ck-editor__editable_inline {
            min-height: 250px;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <h2>Thông tin khóa học cơ bản</h2>
    <p class="text-muted">Điền các thông tin dưới đây để tạo khóa học mới của bạn.</p>
    <hr>

    <form th:action="@{/courses/create}" th:object="${courseDTO}" method="post" enctype="multipart/form-data">

        <div class="row g-4">
            <!-- Cột trái (9 phần) cho thông tin chính -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <!-- Tên khóa học -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Tên khóa học (Tiêu đề)</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Ví dụ: Lập trình Java từ Zero đến Hero">
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-3">
                            <label for="category" class="form-label fw-bold">Danh mục</label>
                            <select id="category" class="form-select" th:field="*{categoryId}">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${courseCategories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <!-- Mô tả chi tiết (CKEditor) -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Mô tả</label>
                            <!-- Textarea này sẽ được CKEditor chuyển đổi -->
                            <textarea id="description" th:field="*{description}"></textarea>
                            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></span>
                        </div>

                        <!-- Yêu cầu tiên quyết (CKEditor) -->
                        <div class="mb-3">
                            <label for="prerequisite" class="form-label fw-bold">Yêu cầu tiên quyết</label>
                            <!-- Textarea này cũng sẽ được CKEditor chuyển đổi -->
                            <textarea id="prerequisite" th:field="*{prerequisite}"></textarea>
                            <span th:if="${#fields.hasErrors('prerequisite')}" th:errors="*{prerequisite}" class="text-danger"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải (3 phần) cho Thumbnail, giá, ... -->
            <div class="col-md-4">
                <!-- Thumbnail -->
                <div class="card mb-4">
                    <div class="card-header fw-bold">Ảnh đại diện (Thumbnail)</div>
                    <div class="card-body text-center">
                        <img src="https://placehold.co/600x400/EFEFEF/AAAAAA?text=Preview" alt="Preview" class="preview-img" id="thumbnail-preview">
                        <input type="file" class="form-control form-control-sm" th:field="*{thumbnailFile}" accept="image/*" onchange="previewImage()">
                        <span th:if="${#fields.hasErrors('thumbnailFile')}" th:errors="*{thumbnailFile}" class="text-danger"></span>
                    </div>
                </div>

                <!-- Giá và giảm giá -->
                <div class="card">
                    <div class="card-header fw-bold">Thông tin thương mại</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="fee" class="form-label">Học phí (VND)</label>
                            <input type="number" class="form-control" id="fee" th:field="*{price}" placeholder="500000">
                            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></span>
                        </div>
                        <div class="mb-3">
                            <label for="discount" class="form-label">Giảm giá (%)</label>
                            <input type="number" class="form-control" id="discount" th:field="*{discount}" placeholder="10" min="0" max="100">
                            <span th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}" class="text-danger"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Lưu khóa học</button>
            <a href="/" class="btn btn-secondary">Hủy bỏ</a>
        </div>
    </form>
</div>

<!-- Script xem trước ảnh thumbnail -->
<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('thumbnail-preview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

<!-- Script khởi tạo CKEditor 5 -->
<script>
    ClassicEditor
        .create( document.querySelector( '#description' ) )
        .catch( error => {
            console.error( 'Lỗi khi khởi tạo CKEditor cho description:', error );
        } );

    ClassicEditor
        .create( document.querySelector( '#prerequisite' ) )
        .catch( error => {
            console.error( 'Lỗi khi khởi tạo CKEditor cho prerequisite:', error );
        } );
</script>

</body>
</html>
