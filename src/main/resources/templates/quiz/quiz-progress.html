<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Progress</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            margin-bottom: 15px;
        }
        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        .question-btn {
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ccc;
            text-decoration: none;
            color: black;
            background-color: #f7f7f7;
        }
        .answered {
            background-color: #b3e6b3; /* green */
        }
        .bookmarked {
            border: 2px solid #ffcc00; /* yellow border */
        }
        .unanswered {
            background-color: #f2f2f2;
        }
        .legend {
            margin-top: 20px;
        }
        .legend span {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h2>Quiz Progress</h2>


<div >
    <i class="bi bi-hourglass-split"></i>
    <span id="timer">00:00:00</span>
    <p id="message"></p>
</div>




<script th:inline="javascript">
    // Get endTime from model (Thymeleaf will render it as a string)
    const endTimeStr = /*[[${endTime}]]*/ '';
    // Parse into JS Date object
    const endTime = new Date(endTimeStr.replace(' ', 'T')); // e.g. "2025-10-26T15:45:00"

    function updateTimer() {
        const now = new Date();
        const diffMs = endTime - now;
        const diffSec = Math.floor(diffMs / 1000);

        if (diffSec === 10) document.getElementById("message").innerText = "⚠️ 10 seconds remaining!";

        if (diffSec <= 0) {
            clearInterval(timerInterval);

            // Set the form action to "finish"
            document.getElementById("message").innerText = "⏰ Time’s up! Your quiz will now be submitted."
            // alert("⏰ Time’s up! Your quiz will now be submitted.");
            window.location.href = "result";
            return;
        }

        const minutes = Math.floor(diffSec / 60);
        const seconds = diffSec % 60;

        document.getElementById("timer").textContent =
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);
</script>

<div class="question-grid">
    <a th:each="q, iter : ${questions}"
       th:href="@{'/quiz/' + ${quizId} +'/'+ ${iter.index}}"
       th:class="${'question-btn ' +
              ((#maps.containsKey(answers, q.id) and not answers[q.id].answer.isEmpty) ? 'answered ' : 'unanswered ') +
              ((#maps.containsKey(answers, q.id) and answers[q.id].bookmarked) ? 'bookmarked' : '')}"
       th:text="'Q' + ${iter.index + 1}">
    </a>
</div>

<div class="legend">
    <p><strong>Legend:</strong></p>
    <span class="answered">Answered</span>
    <span class="bookmarked">Bookmarked</span>
    <span class="unanswered">Unanswered</span>
</div>

<br/>
<!--<a th:href="@{'/quiz/' + ${quizId} + '/0'}">Back to Quiz</a>-->
<button type="button" onclick="history.back()">⬅ Back</button>
<!--<button type="button" onclick="window.location.href='/quiz/' + ${quizId} + '/result'">Finish</button>-->
<a th:href="@{'/quiz/'+${quizId}+'/result'}">Finish</a>
</body>
</html>
