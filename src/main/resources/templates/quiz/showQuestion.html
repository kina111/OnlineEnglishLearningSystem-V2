<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            margin: 40px;
        }

        .question-header {
            background-color: #3a3a3a;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer-option {
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 5px;
            display: flex;
            align-items: center;
            transition: border-color 0.3s ease;
        }

        .answer-option input[type="radio"] {
            transform: scale(1.4);
            margin-right: 15px;
        }

        .answer-option.selected {
            border-color: #66c280;
            background-color: #e8f5e9;
        }

        .option-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .green-footer {
            background-color: #66c280;
            padding: 20px;
            margin-top: 30px;
            text-align: right;
        }

        .green-footer button {
            background-color: #66c280;
            color: white;
            border: 2px solid #66c280;
            font-weight: bold;
        }

        .green-footer button:hover {
            background-color: #e8f5e9;
            border-color: white;
        }

        .progress-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<form action="" method="post" class="container" id="quizForm">

    <!-- ✅ Top Progress & Timer Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-geo-alt"></i>
            <span th:text="${questionIndex + 1} + ' / ' + ${questionCount}">1 / 20</span>
        </div>

        <div class="px-3 py-1 rounded" style="background-color: #cfe2ff;">
            <i class="bi bi-hourglass-split"></i>
            <span id="timer">00:00:00</span>
        </div>
        <div class="px-3 py-1 rounded" style="background-color: #e6f7ff;">
            <p id="message" th:text="${progress}"></p>
        </div>
    </div>


    <!-- ✅ Question Header -->
    <div class="question-header mb-4">
        <div><strong th:text="${questionIndex + 1} + ')'">1)</strong></div>
        <div>Question ID: <span th:text="${question.id}">643</span></div>
    </div>

    <!-- ✅ Question Text -->
    <div class="mb-4 fs-5" th:text="${question.content}">
        Question content goes here...
    </div>

    <!-- Display media if exists -->
    <div th:switch="${question.mediaType}">
        <img th:case="'IMAGE'" th:src="${question.mediaUrl}" alt="Image" style="max-width:400px"/>
        <audio th:case="'AUDIO'" controls th:src="${question.mediaUrl}"></audio>
        <video th:case="'VIDEO'" controls th:src="${question.mediaUrl}" style="max-width:400px"></video>
        <div th:case="'NONE'"></div>
    </div>

    <div th:switch="${questionType}">
        <div th:case="MULTIPLE_CHOICE">
            <!-- ✅ Answer Options -->
            <div class="mb-4">
                <div th:each="answer, iterStat : ${question.answerOptions}" class="answer-option">

                    <input type="checkbox"
                           name="answer"
                           th:value="${answer.id}"
                           th:id="'option_' + ${iterStat.index}"
                           th:checked="${answeredOptionId != null and answeredOptionId.contains(answer.id)}" />
                    <label th:for="'option_' + ${iterStat.index}" class="form-check-label">
                        <span th:text="${(iterStat.index)} + '.'">A.</span>
                        <span th:text="${answer.content}">Answer content</span>
                    </label>

                </div>
            </div>
        </div>

        <div th:case="SHORT_ANSWER">
            <!-- Short Answer -->
            <div>
               <input type="text" name="answer" placeholder="Nhập câu trả lời..."
                      th:value="${answeredOption != null and !answeredOption.answer.isEmpty()} ? ${answeredOption.answer.get(0)} : ''">
            </div>
        </div>
    </div>



    <!-- ✅ Top Right Buttons -->
    <div class="d-flex justify-content-end mb-3 gap-2">
        <button type="button" class="btn btn-secondary">Peek at Answer</button>
        <input type="checkbox" class="btn btn-secondary " name="isMarked"
               th:checked="${answeredOption != null and answeredOption.isBookmarked()}">
        Mark for Review</input>
    </div>


    <!-- ✅ Navigation Buttons in Green Footer -->
    <div class="green-footer d-flex justify-content-between">
        <div>
            <button type="submit" class="btn" name="action" value="previous"
                    th:if="${questionIndex > 0}">Previous</button>
        </div>
        <div>
            <button type="submit" class="btn" name="action" value="progress">Review Progress</button>
        </div>
        <div>
            <button type="submit" class="btn" name="action" value="next"
                    th:if="${questionIndex < questionCount - 1}">Next</button>
            <button type="submit" class="btn" name="action" value="finish"
                    th:if="${questionIndex == questionCount - 1}"
                    onclick="return confirm('Are you sure you want to finish?');">Finish</button>
        </div>
    </div>
    <input type="hidden" id="autoAction" name="autoAction" value="">
</form>

<script>
    // Highlight selected answer (client-side visual feedback)
    document.addEventListener('DOMContentLoaded', function () {
        const checkboxes = document.querySelectorAll('.answer-option input[type="checkbox"]');

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    checkbox.closest('.answer-option').classList.add('selected');
                } else {
                    checkbox.closest('.answer-option').classList.remove('selected');
                }
            });
        });

        // Initial highlight for any pre-checked boxes
        document.querySelectorAll('.answer-option input[type="checkbox"]:checked')
            .forEach(checkedBox => {
                checkedBox.closest('.answer-option').classList.add('selected');
            });
    });

</script>
<script th:inline="javascript">
    // Get endTime from model (Thymeleaf will render it as a string)
    const endTimeStr = /*[[${endTime}]]*/ '';
    // Parse into JS Date object
    const endTime = new Date(endTimeStr.replace(' ', 'T')); // e.g. "2025-10-26T15:45:00"

    function updateTimer() {
        const now = new Date();
        const diffMs = endTime - now;
        const diffSec = Math.floor(diffMs / 1000);

        if (diffSec === 10) document.getElementById("message").innerText = "⚠️ 10 seconds remaining!";

        if (diffSec <= 0) {
            clearInterval(timerInterval);

            // Set the form action to "finish"
            document.getElementById("autoAction").value = "finish";
            document.getElementById("message").innerText = "⏰ Time’s up! Your quiz will now be submitted."
            // alert("⏰ Time’s up! Your quiz will now be submitted.");
            document.getElementById("quizForm").submit();
            return;
        }

        const minutes = Math.floor(diffSec / 60);
        const seconds = diffSec % 60;

        document.getElementById("timer").textContent =
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);
</script>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
