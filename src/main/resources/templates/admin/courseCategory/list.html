<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Người dùng</title>
    <style>
        :root {
            --primary-color: #6c63ff;
            --primary-hover: #5a54d6;
            --secondary-color: #4ecdc4;
            --text-color: #333;
            --text-light: #666;
            --bg-color: #fff;
            --bg-light: #f8f9fa;
            --border-color: #e9ecef;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 600;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: var(--bg-light);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
        }

        .search-box {
            grid-column: 1 / -1;
        }

        select, input {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--bg-color);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
        }

        .table-container {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-color);
        }

        th {
            background: var(--bg-light);
            padding: 16px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.3s ease;
            position: relative;
        }

        th:hover {
            background: #e9ecef;
        }

        th a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-icon {
            color: var(--primary-color);
            font-weight: bold;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background: var(--bg-light);
        }

        .status-active {
            color: #28a745;
            font-weight: 600;
            padding: 6px 12px;
            background: #d4edda;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-inactive {
            color: #dc3545;
            font-weight: 600;
            padding: 6px 12px;
            background: #f8d7da;
            border-radius: 20px;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .pagination a {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .pagination a:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .pagination a.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .filters {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Quản lý danh mục</h1>
        <a href="/admin/course_categories/create" class="btn btn-primary">
            <span>+</span> Thêm danh mục mới
        </a>
    </div>

    <div class="filters">
        <div class="filter-group">
            <label>Trạng thái</label>
            <select id="activeFilter" onchange="applyFilters()">
                <option value="ALL">Tất cả trạng thái</option>
                <option value="true" th:selected="${param.active == 'true'}">Đang hoạt động</option>
                <option value="false" th:selected="${param.active == 'false'}">Không hoạt động</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Tìm kiếm</label>
            <div style="display: flex; gap: 10px;">
                <input type="text"
                       id="searchInput"
                       placeholder="Tìm theo từ khóa..."
                       th:value="${param.search}">
            </div>
        </div>
    </div>

    <div class="table-container">
        <table id="usersTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Mô tả</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="courseCategory : ${courseCategoryPage.content}" th:unless="${courseCategoryPage.content.empty}">
                <td th:text="${courseCategory.id}"></td>
                <td th:text="${courseCategory.name}"></td>
                <td th:text="${courseCategory.description}"></td>
                <td>
                    <span th:if="${courseCategory.active}" class="status-active">Đang hoạt động</span>
                    <span th:unless="${courseCategory.active}" class="status-inactive">Không hoạt động</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/admin/course_categories/update/{id}(id=${courseCategory.id})}"
                           class="btn btn-outline btn-sm">✏️ Sửa</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${courseCategoryPage.content.empty}">
                <td colspan="8" class="no-data">
                    📝 Không tìm thấy danh mục nào
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${courseCategoryPage.totalPages > 0}" class="pagination">
        <a th:each="pageNumber : ${pageNumbers}"
           th:href="@{/admin/course_categories(
                   size=${courseCategoryPage.size},
                   page=${pageNumber - 1},
                   search=${param.search},
                   active=${param.active}
               )}"
           th:text="${pageNumber}"
           th:class="${pageNumber == courseCategoryPage.number + 1} ? 'active' : ''"></a>
    </div>
</div>

<script>
    function applyFilters() {
        const active = document.getElementById('activeFilter').value;
        const search = document.getElementById('searchInput').value;

        const urlParams = new URLSearchParams();

        if (active !== 'ALL') urlParams.set('active', active);
        if (search) urlParams.set('search', search);

        window.location.href = '/admin/course_categories?' + urlParams.toString();
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            applyFilters();
        }
    });

    // Auto-select current filter values from URL
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);

        // Set values from URL parameters
        const active = urlParams.get('active');
        const search = urlParams.get('search');

        if (active) document.getElementById('activeFilter').value = active;
        if (search) document.getElementById('searchInput').value = search;
    });
</script>
</body>
</html>
